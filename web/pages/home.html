<div class="card">
      <h2>Device Status</h2>
      <div class="info-row">
        <span class="label">Serial #</span>
        <span class="value" id="serial"></span>
      </div>
      <div class="info-row">
        <span class="label">Version</span>
        <span class="value" id="version"></span>
      </div>
      <div class="info-row">
        <span class="label">WiFi Status</span>
        <span class="status">Connected</span>
      </div>
      <div class="info-row">
        <span class="label">IP Address</span>
        <span class="value" id="ip-address"></span>
      </div>
      <div class="info-row">
        <span class="label">Free Memory</span>
        <span class="value" id="free-heap"></span>
      </div>
    </div>

    <div class="card">
      <h2>Reading Stats</h2>
      <div class="info-row">
        <span class="label">Totals, reading days and per-book stats from this reader</span>
      </div>
      <div class="info-row">
        <a class="stats-download-btn" href="/api/stats?download=1" download="quartzink-stats.json">Download reading stats</a>
      </div>
    </div>
