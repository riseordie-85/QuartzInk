<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>{{ title }}</title>
  <link rel="icon" href="/logo.png?v={{ v }}" />
  <link rel="preload" href="/jost.woff2?v={{ v }}" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/style.css?v={{ v }}" />
{{ head_extra }}
  <style>
{{ styles }}
  </style>
</head>
<body class="page-{{ slug }}">
  <header class="qz-bar">
    <a class="qz-wordmark" href="/"><b>Quartz</b> Ink</a>
    <span class="qz-page-title">{{ page_title }}</span>
  </header>

  <nav class="nav-links">
    <a href="/"{{ cls_home }}>Home</a>
    <a href="/files"{{ cls_files }}>Files</a>
    <a href="/wallpapers"{{ cls_wallpapers }}>Wallpapers</a>
    <a href="/fonts"{{ cls_fonts }}>Fonts</a>
    <a href="/stats"{{ cls_stats }}>Stats</a>
    <a href="/settings"{{ cls_settings }}>Settings</a>
  </nav>

{{ body }}

  <p class="footer">QuartzInk &bull; A CrossPoint/CrossInk fork &bull; Open Source</p>

<script>
  (function () {
    var active = document.querySelector('.nav-links .active');
    if (active && active.scrollIntoView) active.scrollIntoView({ block: 'nearest', inline: 'center' });
  })();
</script>
{{ script }}
</body>
</html>
