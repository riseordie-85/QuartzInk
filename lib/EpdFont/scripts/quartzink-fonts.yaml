# QuartzInk's default reading fonts: Readerly and the core set of Nico
# Verbruggen's e-reader fonts (https://github.com/nicoverbruggen/ebook-fonts),
# all under free licenses that allow redistribution. Libron and NV Jost are
# built into the firmware, so they are not in these packs. Built into .cpfont packs
# for the X3 with build-sd-fonts.py --config quartzink-fonts.yaml; the X4 Pro
# reads the same .ttf files directly.

families:
  - name: Readerly
    description: "Bookerly-style serif tuned for e-ink"
    languages: "Latin"
    intervals: latin-ext
    sizes: [8, 9, 10, 12, 14, 16, 18, 20]
    styles:
      regular: { url: "https://raw.githubusercontent.com/nicoverbruggen/ebook-fonts/main/fonts/extra/Readerly-Regular.ttf" }
      bold: { url: "https://raw.githubusercontent.com/nicoverbruggen/ebook-fonts/main/fonts/extra/Readerly-Bold.ttf" }
      italic: { url: "https://raw.githubusercontent.com/nicoverbruggen/ebook-fonts/main/fonts/extra/Readerly-Italic.ttf" }
      bolditalic: { url: "https://raw.githubusercontent.com/nicoverbruggen/ebook-fonts/main/fonts/extra/Readerly-BoldItalic.ttf" }

  - name: Sourcerer
    description: "Serif"
