<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>QuartzInk</title>
    <link rel="stylesheet" href="/assets/web.css" />
    <link rel="icon" type="image/png" href="/assets/logo.png" />
    <link rel="preload" href="/assets/jost.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="theme-color" content="#000000" />
    <style>
.qz-tiles {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
}
.qz-tile {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 18px;
  aspect-ratio: 1 / 1;
  padding: 18px 12px;
  border: var(--qz-border) solid #000;
  border-radius: var(--qz-radius);
  background: #fff;
  color: #000;
  text-decoration: none;
  font-weight: 700;
  font-size: 1.25em;
  text-align: center;
  transition: background-color 0.12s, color 0.12s;
}
.qz-tile svg {
  /* A fixed icon box keeps the labels on one line across a row. */
  width: 44%;
  max-width: 120px;
  height: 40%;
}
a.qz-tile:hover,
a.qz-tile:focus-visible {
  background: #000;
  color: #fff;
  outline: none;
}
.qz-tile.wide {
  grid-column: 1 / -1;
  aspect-ratio: auto;
  min-height: 200px;
}
.qz-tile.wide svg {
  width: auto;
  height: 96px;
}
.qz-tile.wide.slim {
  min-height: 0;
  padding: 22px 12px;
}
.qz-tile[aria-disabled="true"] {
  color: #000;
  cursor: default;
}
.qz-device {
  margin: 20px 0 0;
  text-align: center;
  color: var(--label-color);
  font-size: 0.9em;
}
.qz-settings-link {
  margin: 4px 0 0;
  text-align: center;
}
.qz-settings-link a {
  color: #000;
  font-weight: 700;
}
@media (max-width: 600px) {
  .qz-tiles {
    gap: 12px;
  }
  .qz-tile {
    font-size: 1.05em;
    gap: 12px;
  }
  .qz-tile.wide {
    min-height: 150px;
  }
  .qz-tile.wide.slim {
    min-height: 0;
  }
  .qz-tile.wide svg {
    height: 72px;
  }
}
    </style>
  </head>
  <body class="web-ui">
    <!--#include file="shared/Header.html.inc" -->

<p class="qz-device" id="deviceLine"></p>
<p class="qz-settings-link"><a href="/settings">Device settings</a></p>
</div>
<!--#include file="shared/Footer.html.inc" -->
  <script>
    // A short device line under the tiles: model, firmware and address.
    async function fetchStatus() {
      try {
        const response = await fetch('/api/status');
        if (!response.ok) throw new Error(response.status + ' ' + response.statusText);
        const data = await response.json();
        const parts = [data.device, data.version ? 'v' + data.version : '', data.ip].filter(Boolean);
        document.getElementById('deviceLine').textContent = parts.join(' \u00b7 ');
      } catch (error) {
        console.error('Error fetching status:', error);
      }
    }
    fetchStatus();
  </script>

</html>
